name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check tests/ examples/ --select E9,F
      - name: Test
        run: pytest -q